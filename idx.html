<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Caval James 工具与项目集合">
  <title>SugarDada | 导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/idx.css">
</head>
<body>
  <div class="shell">
    <header class="page-header">
      <h1>导航</h1>
      <p>小游戏、工具和网址集合</p>
    </header>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索项目...">
    </div>

    <nav class="filter-nav" id="filterNav"></nav>

    <section id="siteGrid" class="bento-grid"></section>

    <footer>© 2026 Caval James · Powered by static hosting</footer>
  </div>

  <script src="site-index.config.js"></script>
  <script>
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
    }

    let currentFilter = '全部'

    function renderSiteIndex(list) {
      const grid = document.getElementById('siteGrid')

      if (!list.length) {
        grid.className = 'bento-grid'
        grid.innerHTML = '<div class="empty">没有匹配的项目</div>'
        return
      }

      grid.innerHTML = list.map((item, i) => {
        const sizeClass = item.large ? ' large' : ''
        const gradient = escapeHtml(item.gradient || 'linear-gradient(135deg, #e0e7ff, #f0e6ff)')
        return `
          <a class="bento-card${sizeClass}" href="${escapeHtml(item.href)}" style="background: ${gradient}">
            <div>
              <span class="card-icon">${item.icon || '🔗'}</span>
              <h2>${escapeHtml(item.title)}</h2>
              <p>${escapeHtml(item.desc || '')}</p>
            </div>
            <span class="card-category">${escapeHtml(item.category || '')}</span>
          </a>
        `
      }).join('')
    }

    function renderFilters(list) {
      const nav = document.getElementById('filterNav')
      const categories = ['全部', ...new Set(list.map(item => item.category).filter(Boolean))]

      nav.innerHTML = categories.map(cat => {
        const active = cat === currentFilter ? ' active' : ''
        return `<button class="filter-btn${active}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
      }).join('')

      nav.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn')
        if (!btn) return
        currentFilter = btn.dataset.cat
        applyFilters()
      })
    }

    function applyFilters() {
      const list = window.SITE_INDEX || []
      const query = document.getElementById('searchInput').value.trim().toLowerCase()

      const filtered = list.filter(item => {
        const matchCat = currentFilter === '全部' || item.category === currentFilter
        const matchSearch = !query || item.title.toLowerCase().includes(query) || (item.desc || '').toLowerCase().includes(query)
        return matchCat && matchSearch
      })

      renderSiteIndex(filtered)

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === currentFilter)
      })
    }

    function loadSiteIndex() {
      const grid = document.getElementById('siteGrid')
      const list = window.SITE_INDEX

      if (Array.isArray(list)) {
        renderFilters(list)
        renderSiteIndex(list)
        document.getElementById('searchInput').addEventListener('input', applyFilters)
        return
      }

      grid.className = 'empty'
      grid.textContent = '导航配置加载失败，请检查 site-index.config.js。'
    }

    loadSiteIndex()
  </script>
</body>
</html>
